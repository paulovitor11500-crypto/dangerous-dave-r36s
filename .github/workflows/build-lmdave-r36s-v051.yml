
name: Build Dangerous Dave R36S v0.5.1

on:
  push:
    paths:
      - 'lmdave-r36s-v051.c'
      - '.github/workflows/build-lmdave-r36s-v051.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libsdl2-dev

      - name: Download original lmdave
        run: |
          git clone --depth 1 https://github.com/MaiZure/lmdave.git upstream-lmdave

      - name: Apply R36S v0.5.1 source
        run: |
          cp lmdave-r36s-v051.c upstream-lmdave/lmdave.c

      - name: Compile ARM64 executable
        run: |
          cd upstream-lmdave
          gcc -O2 -Wall -x c lmdave.c -o lmdave $(sdl2-config --cflags --libs)
          file lmdave

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: dangerous-dave-r36s-v051-arm64
          path: upstream-lmdave/lmdave
          
