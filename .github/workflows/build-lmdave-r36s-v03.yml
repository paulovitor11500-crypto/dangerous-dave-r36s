
name: Compilar Dangerous Dave R36S v0.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Preparar codigo
        run: |
          git clone --depth 1 https://github.com/MaiZure/lmdave.git upstream-lmdave
          cp lmdave-r36s-v03.c upstream-lmdave/lmdave.c

      - name: Compilar ARM64
        run: |
          cd upstream-lmdave
          gcc -O2 -Wall -x c lmdave.c \
            -o lmdave \
            $(sdl2-config --cflags --libs)
          file lmdave

      - name: Publicar executavel
        uses: actions/upload-artifact@v4
        with:
          name: dangerous-dave-r36s-v03-arm64
          path: upstream-lmdave/lmdave
